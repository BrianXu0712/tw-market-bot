name: Daily TW Market Report

on:
  schedule:
    # 週一至週五 台灣時間 09:00 (UTC 01:00) 與 15:00 (UTC 07:00)
    - cron: '0 1 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 允許在 GitHub 網頁上手動點擊立即測試

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script and send Telegram alert
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python market_dashboard.py
