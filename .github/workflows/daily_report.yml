name: Daily TW Market Report

on:
  schedule:
    # 台灣時間 每天 07:00（對應 UTC 23:00）
    - cron: '0 23 * * *'
    # 台灣時間 每天 21:35（對應 UTC 13:35）
    - cron: '35 13 * * *'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script and send Telegram alert
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python market_dashboard.py
